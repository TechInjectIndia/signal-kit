name: Feature request
description: Propose a focused feature backed by a concrete problem.
title: '[Feature]: '
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who encounters this problem, how often, and what is its impact?
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Concrete workflow or reproducer
      description: Describe a real workflow using synthetic or redacted examples. Include framework/runtime and providers where relevant.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Existing alternatives
      description: What have you tried, and why is it insufficient? Explain whether documentation or a recipe could solve it.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope and success criteria
      description: Describe the smallest useful change, how it would be verified, and any consent, privacy, performance, or maintenance implications.
    validations:
      required: true
