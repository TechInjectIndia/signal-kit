name: Releases
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: signalkit-releases
  cancel-in-progress: false
jobs:
  version:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pending: ${{ steps.mode.outputs.pending }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - run: npm install --global pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - id: mode
        run: node -e "const fs=require('fs');fs.appendFileSync(process.env.GITHUB_OUTPUT,'pending='+fs.readdirSync('.changeset').some(f=>f.endsWith('.md')&&f!=='README.md')+'\n')"
      - uses: changesets/action/version@615034bb14e5d240e559f941ce9769beb5e14fb0
        if: steps.mode.outputs.pending == 'true'
        with:
          script: pnpm release:version
          github-token: ${{ secrets.GITHUB_TOKEN }}
  publish:
    needs: version
    if: needs.version.outputs.pending == 'false' && vars.NPM_RELEASES_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: npm-release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.4
      - run: npm install --global npm@11.6.2 pnpm@10.24.0
      - run: pnpm install --frozen-lockfile
      - run: |
          pnpm check
          pnpm format:check
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:boundaries
          pnpm test:packages
          pnpm test:bundle
          pnpm test:release
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          pnpm test:sveltekit
          pnpm test:site:e2e
          pnpm release:prepare
          pnpm test:alpha
      - run: pnpm release:publish
      - name: GitHub release and downloadable artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-release.mjs
