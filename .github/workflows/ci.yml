name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - name: Check repository and JavaScript syntax
        run: node scripts/repository-check.mjs
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.4
      - name: Install pinned pnpm and dependencies
        run: |
          npm install --global pnpm@10.24.0
          pnpm install --frozen-lockfile
      - name: Build, types, tests and boundaries
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          pnpm format:check
          pnpm build
          pnpm typecheck
          pnpm test
          pnpm test:boundaries
          pnpm test:next-otel
          pnpm test:packages
          pnpm test:bundle
          pnpm release:prepare
          pnpm test:alpha
      - name: Browser runtime verification
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm test:e2e
          pnpm test:site:e2e
