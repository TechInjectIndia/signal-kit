name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - name: Check repository and JavaScript syntax
        run: bun scripts/repository-check.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build, types, tests and boundaries
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          bun run format:check
          bun run build
          bun run typecheck
          bun run test
          bun run test:boundaries
          bun run test:next-otel
          bun run test:packages
          bun run test:bundle
          bun run test:release
          bun run release:prepare
          bun run test:alpha
      - name: Browser runtime verification
        run: |
          bunx playwright install --with-deps chromium
          bun run test:e2e
          bun run test:site:e2e
          bun run test:sveltekit

  consumer-apps:
    # Bun is internal tooling. Client apps may use Node with npm, pnpm or yarn, or Bun.
    name: Consumer apps (Node 22 npm/pnpm/yarn, Bun)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Build published packages
        run: bun run build --filter='./packages/features/signals/*'
      - name: Install packed tarballs into npm, pnpm, yarn and Bun client apps
        env:
          NEXT_TELEMETRY_DISABLED: '1'
        run: bun run test:consumers
